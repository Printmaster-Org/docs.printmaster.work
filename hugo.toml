baseURL = 'https://docs.printmaster.work/'
languageCode = 'en-us'
title = 'PrintMaster Docs'
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term']

[params]
  description = 'PrintMaster installation, operations, printer and copier setup, and API references.'
  repository = 'https://github.com/Printmaster-Org/docs.printmaster.work'
  programRepository = 'https://github.com/Printmaster-Org/printmaster'

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[markup.goldmark.renderer]
  unsafe = true # Authored docs contain details, tables, and architecture diagrams.

[markup.goldmark.parser.attribute]
  block = true

[markup.highlight]
  noClasses = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[sitemap]
  changeFreq = 'weekly'

[[menus.main]]
  name = 'Start here'
  pageRef = '/start-here'
  weight = 10
[[menus.main]]
  name = 'PrintMaster'
  pageRef = '/guides'
  weight = 20
[[menus.main]]
  name = 'Scanning & SMB'
  pageRef = '/scanning'
  weight = 30
[[menus.main]]
  name = 'Printers & copiers'
  pageRef = '/printers'
  weight = 40
[[menus.main]]
  name = 'Deployment'
  pageRef = '/deployment'
  weight = 50
[[menus.main]]
  name = 'API'
  pageRef = '/api'
  weight = 60
