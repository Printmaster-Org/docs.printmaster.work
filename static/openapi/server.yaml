openapi: 3.0.3
x-reviewed-commit: 864fc3ee040bbb28f25d779c69512c5b6999d421
x-review-notes: |
  Reviewed 2026-10-02 against committed PrintMaster security hardening at
  x-reviewed-commit, which contains the storage, tenant API, server channel,
  and Agent authentication slices. This is a source revision, not a release.
  Per-operation x-source identifies reviewed committed handlers. Coverage
  remains 14 Server operations; Agent's independent seven-operation contract
  is unchanged. Contract 0.2.1 corrects authorization/tenant documentation and
  response semantics without new operations, route or machine-protocol bumps.
  Stricter ownership/auth can deny previously accepted unsafe requests; this
  compatible documentation patch is not a promise of permissive legacy access.
info:
  title: PrintMaster Server Integration API
  version: 0.2.1
  description: |
    Verified subset of existing server HTTP endpoints; not a complete
    API inventory or a new anonymous service. Reviewed against committed source
    864fc3ee040bbb28f25d779c69512c5b6999d421; see x-review-notes.
    No released binary or comprehensive runtime-security certification is claimed.
    x-source paths are relative to the program repository, not this docs repo.
    Operation coverage and existing login/logout POST operations are retained.
    This contract version is independent of the program version. Existing UI
    endpoints have no separate stable public-API compatibility guarantee.
    Use your own HTTPS server. User sessions are not agent registration tokens.
    Schemas labeled partial intentionally allow additional implementation fields.
    Caller-derived ownership restrictions now protect reviewed inventory,
    alerts and reports. Authorization still differs by operation; tenancy
    reads remain administrator-only. Historical metrics identity, unbounded
    queries and routes outside this subset require separate review.
  license:
    name: MIT
    url: https://github.com/Printmaster-Org/printmaster/blob/main/LICENSE
servers:
  - url: https://{host}
    description: Your HTTPS PrintMaster server, including port if needed
    variables:
      host:
        default: printmaster.example.com
security:
  - sessionBearer: []
  - sessionCookie: []
tags:
  - name: Authentication
  - name: Fleet
  - name: Metrics
  - name: Alerts
  - name: Reports
  - name: Tenancy
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      x-source: {path: server/main.go, handler: handleAuthLogin}
      tags: [Authentication]
      summary: Create a local user session
      description: Returns a session token and sets pm_session. Use SSO in the application when local credentials are unavailable. Successful sessions are created for 24 hours in this snapshot.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string, minLength: 1}
                password: {type: string, minLength: 1, format: password, writeOnly: true}
      responses:
        '200':
          description: Session created
          headers:
            Set-Cookie:
              description: HttpOnly pm_session cookie; Secure when request is recognized as HTTPS; SameSite=Lax
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                required: [success, token, expires_at]
                properties:
                  success: {type: boolean}
                  token: {type: string, description: Sensitive user session credential}
                  expires_at: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/auth/me:
    get:
      operationId: currentUser
      x-source: {path: server/main.go, handler: handleAuthMe}
      tags: [Authentication]
      summary: Inspect current user session
      description: Session authentication only. The handler does not restrict the HTTP method; GET is the documented read operation.
      responses:
        '200':
          description: User and tenant context, without a password hash
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer, format: int64}
                  username: {type: string}
                  role: {type: string, enum: [admin, operator, viewer]}
                  tenant_id: {type: string}
                  tenant_ids: {type: array, nullable: true, items: {type: string}}
                  created_at: {type: string, format: date-time}
                  session_token_hash: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/auth/logout:
    post:
      operationId: logout
      x-source: {path: server/main.go, handler: handleAuthLogout}
      tags: [Authentication]
      summary: Delete current session and expire cookie
      description: Session deletion errors are ignored; success does not confirm storage deletion.
      responses:
        '200':
          description: Session terminated
          headers:
            Set-Cookie:
              description: Expires pm_session at the Unix epoch; HttpOnly; Secure when request is recognized as HTTPS; SameSite=Lax
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
  /api/v1/agents/list:
    get:
      operationId: listAgents
      x-source: {path: server/main.go, handler: handleAgentsList}
      tags: [Fleet]
      summary: List agents accessible to the user
      description: Requires agents.read authorization and a tenant scope for non-admin users. A nonempty limit enables pagination; missing or empty limit returns a legacy array. Invalid/nonpositive limit becomes 50, values over 200 clamp to 200; negative offset becomes zero. Agent token fields are blanked. Results are filtered to the caller's tenant scope.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Array without limit, paginated envelope with limit
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: {$ref: '#/components/schemas/Agent'}
                  - allOf:
                      - {$ref: '#/components/schemas/Pagination'}
                      - type: object
                        required: [agents]
                        properties:
                          agents: {type: array, items: {$ref: '#/components/schemas/Agent'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/devices/list:
    get:
      operationId: listDevices
      x-source: {path: server/main.go, handler: handleDevicesList}
      tags: [Fleet]
      summary: List fleet devices with available latest metrics
      description: |
        Requires devices.read authorization and a tenant scope for non-admin
        users. Same pagination rules as agents/list. Partial core schema;
        additional implementation fields may be returned. Latest metrics are
        best-effort; their retrieval failure does not fail the device list.
        A restricted caller with zero matching agents receives [] or a devices:
        [] envelope with total_count=0 and has_more=false; an empty restriction
        never reaches unrestricted storage queries. Scoped callers cannot see
        unassigned/foreign agents' devices. Counts and rows share the same
        agent selection. Latest enrichment still queries by serial; ownership
        history/reused serials need separate validation.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Array without limit, paginated envelope with limit
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: {$ref: '#/components/schemas/Device'}
                  - allOf:
                      - {$ref: '#/components/schemas/Pagination'}
                      - type: object
                        required: [devices]
                        properties:
                          devices: {type: array, items: {$ref: '#/components/schemas/Device'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/devices/metrics/history:
    get:
      operationId: deviceMetricsHistory
      x-source: {path: server/main.go, handler: handleMetricsHistory}
      tags: [Metrics]
      summary: Read uploaded device metrics history
      description: |
        Requires metrics.history.read and a tenant scope for non-admin users;
        scoped requests check the device's owning agent tenant. Uses the server
        DB, not a live agent query. since overrides period. Unknown period falls
        back to week. until is not read by the handler, despite its source
        comment; there is no upper time bound. Rows are timestamp-ascending.
        raw=true disables downsampling. Otherwise maxPoints defaults to 200,
        invalid/nonpositive values retain 200, and values above 10000 clamp.
        maxPoints 1 or 2 bypasses downsampling, so it is not a strict row limit.
        Empty history is null with the reviewed store. Admin requests do not
        check device existence before querying history.
      parameters:
        - {$ref: '#/components/parameters/Serial'}
        - name: since
          in: query
          description: RFC3339 lower bound, inclusive; nonempty invalid value returns 400.
          schema: {type: string, format: date-time}
        - name: period
          in: query
          description: Used only without a nonempty since; day=24h, week=7d, month=30d, year=365d. Unknown values use week.
          schema: {type: string, default: week}
        - name: maxPoints
          in: query
          schema: {type: integer, default: 200}
        - name: raw
          in: query
          description: Only the literal string true disables downsampling.
          schema: {type: string, default: 'false'}
      responses:
        '200':
          description: Timestamp-ascending snapshots, possibly downsampled; null when no rows exist
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items: {$ref: '#/components/schemas/MetricsSnapshot'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/devices/metrics/bounds:
    get:
      operationId: deviceMetricsBounds
      x-source: {path: server/main.go, handler: handleMetricsBounds}
      tags: [Metrics]
      summary: Read stored device metrics timestamp bounds and count
      description: Requires metrics.history.read and a tenant scope for non-admin users; scoped requests check the device's owning agent tenant. Store errors, including absent metrics, become 404. Admin requests do not check device existence first.
      parameters:
        - {$ref: '#/components/parameters/Serial'}
      responses:
        '200':
          description: Bounds formatted as UTC RFC3339Nano and stored row count
          content:
            application/json:
              schema:
                type: object
                required: [serial, min_timestamp, max_timestamp, points]
                properties:
                  serial: {type: string}
                  min_timestamp: {type: string, format: date-time}
                  max_timestamp: {type: string, format: date-time}
                  points: {type: integer, format: int64}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
  /api/v1/alerts/summary:
    get:
      operationId: alertSummary
      x-source: {path: server/alerts/api.go, handler: API.handleAlertSummary}
      tags: [Alerts]
      summary: Read accessible alert summary
      description: |
        Requires settings.alerts.read and authenticated caller-derived scope.
        Admin without tenant_id receives the global summary. Other requests
        aggregate only visible alerts/rules/channels/maintenance windows;
        shared records require ownership of every tenant. Empty restricted
        membership returns zero counts, not fleet data. tenant_id narrows scope;
        foreign tenant returns 403. Scoped summary omits global quiet-hours
        state (is_quiet_hours=false); legacy scope-breakdown counters stay zero.
        Routes remain enabled; this is not a fleet-wide summary for nonadmins.
      parameters:
        - {$ref: '#/components/parameters/AlertTenant'}
      responses:
        '200':
          description: Caller-scoped counts/state, or global summary for an unfiltered admin; partial schema
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlertSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AlertForbidden'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/AlertServerError'}
  /api/v1/alerts:
    get:
      operationId: listAlerts
      x-source: {path: server/alerts/api.go, handler: API.handleAlerts}
      tags: [Alerts]
      summary: List active or acknowledged alerts
      description: |
        API.handleAlerts delegates GET to API.handleListAlerts. Requires
        settings.alerts.read and caller-derived tenant scope. tenant_id may
        narrow but cannot replace that scope; foreign tenant returns 403.
        Empty restricted membership yields no alerts. Global/unassigned alerts
        are admin-only. Visibility is applied before pagination and totals.
        The store restricts results to active/acknowledged; parsed status is
        ignored by ListActiveAlerts. Other nonempty string filters use exact DB
        equality without enum validation. Ordering is severity DESC (lexical),
        then triggered_at DESC. Positive integer limit enables in-memory pagination;
        absent/invalid/nonpositive limit means unlimited. Nonnegative integer
        offset is echoed but only applied with positive limit. No 200-row cap.
      parameters:
        - name: status
          in: query
          description: Parsed by the handler but ignored by the reviewed store; not a historical-alert selector.
          schema: {type: string}
        - name: severity
          in: query
          schema: {type: string}
        - name: scope
          in: query
          schema: {type: string}
        - name: type
          in: query
          schema: {type: string}
        - {$ref: '#/components/parameters/AlertTenant'}
        - name: limit
          in: query
          schema: {type: integer, default: 0}
        - name: offset
          in: query
          schema: {type: integer, default: 0}
      responses:
        '200':
          description: Always an envelope; count is returned rows, total_count is visible matching rows before pagination; empty alerts is []
          content:
            application/json:
              schema:
                type: object
                required: [alerts, count, total_count, offset, limit, has_more]
                properties:
                  alerts: {type: array, items: {$ref: '#/components/schemas/Alert'}}
                  count: {type: integer}
                  total_count: {type: integer}
                  offset: {type: integer}
                  limit: {type: integer}
                  has_more: {type: boolean}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AlertForbidden'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/AlertServerError'}
  /api/v1/reports/types:
    get:
      operationId: reportTypes
      x-source: {path: server/api_reports.go, handler: handleReportTypes}
      tags: [Reports]
      summary: List built-in report type identifiers
      description: Requires viewer/operator/admin role and a nonempty tenant membership for nonadmins. Returns static strings, not type descriptor objects; membership-free nonadmins receive 403.
      responses:
        '200':
          description: Built-in type identifiers and their count
          content:
            application/json:
              schema:
                type: object
                required: [types, count]
                properties:
                  types:
                    type: array
                    items:
                      type: string
                      enum: [device_inventory, usage_summary, supplies_status, alert_history, agent_status, fleet_health, usage_by_device, usage_by_agent, usage_by_site, usage_by_tenant, usage_trends, top_printers]
                  count: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
  /api/v1/reports/summary:
    get:
      operationId: reportSummary
      x-source: {path: server/api_reports.go, handler: handleReportSummary}
      tags: [Reports]
      summary: Read accessible reporting summary
      description: |
        Requires viewer/operator/admin role and nonempty tenant membership for
        nonadmins. Admin receives global storage summary. Nonadmins count
        visible definitions (including shared built-in fleet templates), owned
        schedules and runs with verified immutable execution tenant scope.
        Legacy/unmarked and global runs are admin-only. All tenant IDs of an
        owned definition/run must be accessible, not merely one intersection.
        Query-supplied tenant_id is not read and cannot broaden scope. Scoped
        runs_last_24h/failed_runs_last_24h use a rolling 24-hour window.
      responses:
        '200':
          description: Reporting counts and storage/runtime statistics; partial schema
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/reports:
    get:
      operationId: listReports
      x-source: {path: server/api_reports.go, handler: handleReports}
      tags: [Reports]
      summary: List saved report definitions
      description: |
        Requires viewer/operator/admin role; nonadmins need nonempty tenant
        memberships. Tenant/site/agent/device definitions require access to
        every stored tenant ID. Built-in fleet definitions with empty tenant
        ownership are shared read-only templates, not permission to run or
        download global results. Other global definitions are admin-only.
        These are definitions, not generated report results.
        Nonempty type, scope, created_by use exact DB equality. A nonempty
        built_in compares true only for the literal string true; all other
        nonempty values select false. Invalid integers are ignored. Positive
        limit caps the visible page without a maximum. Positive offset applies
        after visibility filtering even without a positive limit; nonpositive
        offset is ignored. Ordering is name ascending. count is the
        returned row count, not the total matching count. tenant_id is not read.
      parameters:
        - name: type
          in: query
          schema: {type: string}
        - name: scope
          in: query
          schema: {type: string}
        - name: created_by
          in: query
          schema: {type: string}
        - name: built_in
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, default: 0}
        - name: offset
          in: query
          schema: {type: integer, default: 0}
      responses:
        '200':
          description: Visible definitions envelope; reports is [] when no rows exist
          content:
            application/json:
              schema:
                type: object
                required: [reports, count]
                properties:
                  reports: {type: array, items: {$ref: '#/components/schemas/ReportDefinition'}}
                  count: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/tenants:
    get:
      operationId: listTenants
      x-source: {path: server/tenancy/handlers.go, handler: handleTenants}
      tags: [Tenancy]
      summary: List tenants
      description: Requires enabled tenancy and tenants.read (admin only in the reviewed role policy). No query parameters or pagination are read. DB ordering is created_at descending. Authentication runs before the tenancy-enabled check; disabled tenancy returns 404 for authenticated requests.
      responses:
        '200':
          description: Tenant array, null when no DB rows exist; partial item schema
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items: {$ref: '#/components/schemas/Tenant'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405':
          description: Unsupported method; empty body
        '500':
          description: Failed to list tenants; JSON-shaped body without an application/json header (Go may infer text/plain)
          content:
            text/plain:
              schema: {type: string, example: '{"error":"failed to list tenants"}'}
  /api/v1/tenants/{tenantID}/sites:
    get:
      operationId: listTenantSites
      x-source: {path: server/tenancy/sites.go, handler: handleSitesCollection}
      tags: [Tenancy]
      summary: List sites belonging to a tenant
      description: Routed via handleTenantRoute and registered sites subresource. Requires enabled tenancy and tenants.read for tenantID (admin only in the reviewed role policy). No query parameters or pagination are read. No tenant-existence check is made; an unknown tenant can return an empty array. Agent counts are best-effort; lookup errors are ignored and zero counts are omitted.
      parameters:
        - name: tenantID
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Sites array; empty results are always an empty array, not null; partial item schema
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Site'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '405':
          description: Unsupported method; empty body
        '500':
          description: Failed to list sites; text/plain JSON-shaped error via http.Error
          content:
            text/plain:
              schema: {type: string, example: '{"error":"failed to list sites"}'}
components:
  securitySchemes:
    sessionBearer:
      type: http
      scheme: bearer
      description: User session token returned by login; not a JWT or an agent token. Exact Bearer prefix required. A recognized bearer header takes precedence over the cookie; an invalid bearer token does not fall back to a valid cookie. An unrecognized header format falls back to the cookie.
    sessionCookie:
      type: apiKey
      in: cookie
      name: pm_session
      description: Alternative to bearer authentication, not an additional requirement.
  parameters:
    AlertTenant:
      name: tenant_id
      in: query
      description: Optional exact tenant ID narrowing authenticated scope. Foreign tenant returns 403; omission retains caller scope (all tenants only for global admin).
      schema: {type: string}
    Serial:
      name: serial
      in: query
      required: true
      description: Nonempty device serial; missing or empty value returns 400.
      schema: {type: string, minLength: 1}
    Limit:
      name: limit
      in: query
      description: Nonempty value requests paginated fleet results. Use 1–200; invalid/nonpositive values become 50, values above 200 clamp; empty value uses the legacy array.
      schema: {type: integer, minimum: 1, maximum: 200}
    Offset:
      name: offset
      in: query
      description: Used only with limit. Invalid or negative values become zero.
      schema: {type: integer, minimum: 0, default: 0}
  schemas:
    Agent:
      type: object
      description: Partial verified list-response schema; additional fields may be returned.
      additionalProperties: true
      properties:
        id: {type: integer, format: int64}
        agent_id: {type: string}
        name: {type: string}
        hostname: {type: string}
        version: {type: string}
        tenant_id: {type: string}
        status: {type: string}
        last_seen: {type: string, format: date-time}
        connection_type: {type: string}
        site_ids: {type: array, items: {type: string}}
        token: {type: string, description: Always blank in list response}
    Device:
      type: object
      description: Partial verified device-list schema; additional device and latest-metrics fields may be returned.
      additionalProperties: true
      properties:
        serial: {type: string}
        agent_id: {type: string}
        manufacturer: {type: string}
        model: {type: string}
    MetricsSnapshot:
      type: object
      description: Partial verified snapshot schema. Zero counters and empty agent_id/toner_levels are omitted; id may be zero because the history query does not select it.
      additionalProperties: true
      required: [id, serial, timestamp]
      properties:
        id: {type: integer, format: int64}
        serial: {type: string}
        agent_id: {type: string}
        timestamp: {type: string, format: date-time}
        page_count: {type: integer}
        color_pages: {type: integer}
        mono_pages: {type: integer}
        scan_count: {type: integer}
        toner_levels: {type: object, additionalProperties: true}
    Alert:
      type: object
      description: Partial verified alert schema; additional alert lifecycle/notification fields may be returned.
      additionalProperties: true
      properties:
        id: {type: integer, format: int64}
        type: {type: string}
        severity: {type: string}
        scope: {type: string}
        status: {type: string}
        tenant_id: {type: string}
        site_id: {type: string}
        agent_id: {type: string}
        device_serial: {type: string}
        title: {type: string}
        message: {type: string}
        triggered_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AlertSummary:
      type: object
      description: Partial verified summary schema; scope breakdowns and additional state fields may be returned. Map fields can be null.
      additionalProperties: true
      properties:
        active_count: {type: integer}
        acknowledged_count: {type: integer}
        critical_count: {type: integer}
        warning_count: {type: integer}
        info_count: {type: integer}
        resolved_today_count: {type: integer}
        suppressed_count: {type: integer}
        active_rules: {type: integer}
        active_channels: {type: integer}
        alerts_by_type: {type: object, nullable: true, additionalProperties: {type: integer}}
        alerts_by_scope: {type: object, nullable: true, additionalProperties: {type: integer}}
        is_quiet_hours: {type: boolean}
        has_maintenance: {type: boolean}
    ReportDefinition:
      type: object
      description: Partial verified definition schema; report options, delivery configuration and additional fields may be returned.
      additionalProperties: true
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        description: {type: string}
        type: {type: string}
        format: {type: string}
        scope: {type: string}
        tenant_ids: {type: array, items: {type: string}}
        site_ids: {type: array, items: {type: string}}
        agent_ids: {type: array, items: {type: string}}
        created_by: {type: string}
        is_built_in: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ReportSummary:
      type: object
      description: Partial verified summary schema; additional schedule/run statistics may be returned.
      additionalProperties: true
      properties:
        total_reports: {type: integer}
        built_in_reports: {type: integer}
        custom_reports: {type: integer}
        active_schedules: {type: integer}
        total_schedules: {type: integer}
        total_runs: {type: integer}
        runs_today: {type: integer}
        runs_last_24h: {type: integer}
        failed_runs_today: {type: integer}
        failed_runs_last_24h: {type: integer}
        successful_runs: {type: integer}
        average_run_time_ms: {type: integer, format: int64}
        storage_used_bytes: {type: integer, format: int64}
        reports_by_type: {type: object, nullable: true, additionalProperties: {type: integer}}
    Tenant:
      type: object
      description: Partial verified tenant schema; contact, billing and additional fields may be returned.
      additionalProperties: true
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        login_domain: {type: string}
        created_at: {type: string, format: date-time}
    Site:
      type: object
      description: Partial verified site schema; filter rules and additional fields may be returned. Zero agent_count/device_count are omitted.
      additionalProperties: true
      properties:
        id: {type: string}
        tenant_id: {type: string}
        name: {type: string}
        description: {type: string}
        address: {type: string}
        created_at: {type: string, format: date-time}
        agent_count: {type: integer}
        device_count: {type: integer}
    Pagination:
      type: object
      required: [total_count, has_more, limit, offset]
      properties:
        total_count: {type: integer, format: int64}
        has_more: {type: boolean}
        limit: {type: integer}
        offset: {type: integer}
  responses:
    BadRequest:
      description: Invalid JSON, missing credentials/serial, or invalid since timestamp, depending on the operation
      content: {text/plain: {schema: {type: string}}}
    Unauthorized:
      description: Missing/invalid session or credentials
      content: {text/plain: {schema: {type: string}}}
    Forbidden:
      description: Insufficient role or tenant access
      content: {text/plain: {schema: {type: string}}}
    AlertForbidden:
      description: Insufficient role (text/plain), or denied tenant/global scope (JSON); caller-supplied tenant cannot broaden access
      content:
        text/plain:
          schema: {type: string}
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
    MethodNotAllowed:
      description: Unsupported HTTP method
      content: {text/plain: {schema: {type: string}}}
    NotFound:
      description: Device/owning agent unavailable to a scoped metrics request, metrics bounds unavailable, or tenancy disabled, depending on the operation
      content: {text/plain: {schema: {type: string}}}
    AlertServerError:
      description: Failed to get/count/list alerts; JSON error from the alert handler (authorization-not-configured errors, if miswired, are text/plain)
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
        text/plain:
          schema: {type: string}
    ServerError:
      description: Storage, session creation, or authorization configuration failed
      content: {text/plain: {schema: {type: string}}}