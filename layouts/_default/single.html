{{ define "main" }}
<div class="article-layout">
  <article>
    {{ partial "breadcrumbs.html" . }}
    <h1>{{ .Title }}</h1>
    {{ partial "page-status.html" . }}
    <div class="prose">{{ .Content }}</div>
    <div class="page-meta"><a href="{{ site.Params.repository }}/edit/main/content/{{ replace .File.Path "\\" "/" }}">Edit this page ↗</a>{{ with .Params.source }}<a href="{{ $.Site.Params.programRepository }}/blob/{{ $.Params.sourceCommit }}/{{ . }}">Original source ↗</a>{{ end }}</div>
  </article>
  {{ if .TableOfContents }}<aside class="toc"><strong>On this page</strong>{{ .TableOfContents }}</aside>{{ end }}
</div>
{{ end }}
