{{ define "main" }}
<article>
  <div class="eyebrow">Documentation</div>
  <h1>{{ .Title }}</h1>
  <div class="prose">{{ .Content }}</div>
  <div class="card-grid">{{ range .Pages.ByWeight }}<a class="doc-card" href="{{ .RelPermalink }}"><span class="card-icon">{{ if .IsSection }}▤{{ else }}↗{{ end }}</span><h2>{{ .Title }}</h2><p>{{ .Description | default (.Summary | plainify | truncate 130) }}</p></a>{{ end }}</div>
</article>
{{ end }}
